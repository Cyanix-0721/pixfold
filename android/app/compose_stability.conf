// Compose compiler stability configuration for immutable pure-Kotlin :domain value objects.
//
// Why here (in :app) instead of annotating :domain classes with @Immutable:
// - :domain is a pure Kotlin JVM module with zero Android/Compose dependencies (enforced by AdapterBoundaryTest).
// - Only genuinely immutable data classes, enums, and sealed value hierarchies are listed below.
// - Explicitly EXCLUDED mutable / stateful / port types:
//   * com.cyanix.pixfold.domain.task.CancellationToken (@Volatile var cancelled)
//   * com.cyanix.pixfold.domain.settings.SettingsStore / InMemorySettingsStore (mutable store)
//   * com.cyanix.pixfold.domain.pack.CbzEntry (holds mutable ByteArray)
//   * com.cyanix.pixfold.domain.pack.CbzMetaUpdater (platform port interface)
//   * com.cyanix.pixfold.domain.pack.NotAZipException (exception)
//   * com.cyanix.pixfold.domain.plan.RenameActions / UndoActions (platform port interfaces)
//   * com.cyanix.pixfold.domain.source.WorkspaceSource / AndroidGrantReleaser (platform port interfaces)

// All types in these packages are immutable value objects / enums / sealed value hierarchies:
com.cyanix.pixfold.domain.model.**

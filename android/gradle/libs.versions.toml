[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
# BOM 2026.09.00 把 material3 钉在 1.4.0;expressive 组件(FloatingToolbar /
# LoadingIndicator / ButtonGroup / SplitButton / ToggleButton / MaterialShapes /
# FloatingActionButtonMenu)只在 1.5.0 起才有,故单独覆盖 BOM 的版本。
# 1.5.0-rc01 的 aar-metadata 要求 minCompileSdk=37 / AGP 9.1.0,本项目 37 / 9.4.1 已满足。
material3 = "1.5.0-rc01"
activityCompose = "1.13.0"
junit = "4.13.2"
robolectric = "4.17"
aboutLibraries = "15.2.0"
materialKolor = "5.0.1"
androidxTestExtJunit = "1.3.0"
navigationCompose = "2.10.2"
kotlinxSerializationCore = "1.11.0"
# 与 core 同版本:两者必须同步升级,否则 Json 实现与 core 内部 API 会错配。
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.11.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
aboutLibraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "aboutLibraries" }

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# 显式版本优先于 compose-bom 的约束,见 [versions] 里的说明。
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
aboutlibraries-core = { group = "com.mikepenz", name = "aboutlibraries-core", version.ref = "aboutLibraries" }
aboutlibraries-compose-m3 = { group = "com.mikepenz", name = "aboutlibraries-compose-m3", version.ref = "aboutLibraries" }
material-color-utilities = { group = "com.materialkolor", name = "material-color-utilities", version.ref = "materialKolor" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Gradle 构建配置(2026-10-21 提速:内存 / 并行 / 双缓存)
#
# ## 为什么改
#
# 原配置只有两行,四项关键性能开关一个都没开,导致"改一点等很久、CPU 常满载"。
# 本机实测:8 核 16 线程 / 16 GB 物理内存。`.wslconfig` 把 WSL 限到
# `processors = 6` / `memory = 10GB`,故 Windows 侧实际只有 ~6 GB 可给构建用。
#
# ## 逐项理由
#
# **jvmargs 2 GB → 4 GB**
#   2 GB 对 Kotlin 编译进程明显不够,时间花在 GC 上。`testDebugUnitTest` 与
#   `domain:test` 还要各起一个测试 JVM,共享同一台机器时 2 GB 会在压测那一步
#   直接 OOM 或疯狂 full GC。`MaxMetaspaceSize=1g` 防记录类元空间无界增长。
#
#   **为什么是 4 GB 而不是 6 GB(2026-10-21 实测定的)**:四道闸门全程采样
#   Windows 可用物理内存,从 4046 MB 掉到 2471 MB ⇒ 峰值增量仅 ~1.6 GB,
#   上限根本没被逼近。而 Windows 侧总共只剩 ~6 GB —— 堆上限设成 6 GB 是虚高,
#   极端场景(两个测试 JVM + lint worker 同时起)会和系统抢内存触发交换,
#   交换比多做几次 GC 慢得多。4 GB 既有溢出余量,又不越过实际物理预算。
#
# **org.gradle.parallel=true**
#   `:app` 与 `:domain` 两大模块的 task 图部分独立(只有编译依赖)。并行后
#   `:domain:test` 与 `:app` 侧任务可以重叠。这是"CPU 满载"里最健康的那部分
#   满载 —— 它意味着 CPU 被用来做并行工作,而不是单线程 GC 抖动。
#
# **org.gradle.caching=true**
#   build cache 让 task 输出跨构建复用。改文档、只改测试、或某个 task 输入未变
#   时直接命中缓存。四道闸门里 `lintDebug` 与两个 `test*` 是最贵的,命中收益大。
#   ⚠️ 缓存命中不会重写 JUnit XML ⇒ `test-results/*.xml` 的时间戳不再能证明
#   "本次真的跑过"。判定闸门是否真跑,以 `build/gate-last.log` 里的 task 结果为
#   准(`BUILD SUCCESSFUL` + task 行不是 `UP-TO-DATE`/`FROM-CACHE`),不要只看 XML。
#
# **org.gradle.configuration-cache=true**
#   Gradle 9.8 已稳定。configuration 阶段的固定开销在重复构建里直接消失。
#   AGP 9.x + Kotlin 2.4 对 CC 是官方支持的组合。
#   实测(`:app:lintDebug` 连跑两次):首次 `entry stored` 4s,第二次
#   `entry reused` 2s。⚠️ CC 的 key 含**任务集**,任务集变了就重新计算 ——
#   这意味着换一组 gradle 参数(比如临时加 `--tests`)会 miss 一次,属预期。
#   给 `problems=warn` 而不是 `fail`:首次遇到某个插件不兼容时先出警告,
#   不阻塞构建、不必为了"能编译"临时关掉 CC。若将来警告刷屏,改成 `fail` 收紧。
#
# **不设 org.gradle.workers.max**
#   默认已等于 CPU 核数。手设会让 Gradle 与 Kotlin/ForkJoin 线程池争核,
#   是常见的"越调越慢"。
#
# **不设 org.gradle.daemon**
#   默认就是 true。显式写反而给人"需要关心它"的错觉。

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
